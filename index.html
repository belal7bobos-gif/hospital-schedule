<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جدول النوبتجية</title>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>

<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 14px 10px 40px;
    direction: rtl;
  }
  h1 {
    text-align: center;
    color: #1f2d3d;
    font-size: 20px;
    margin: 4px 0 4px;
  }
  .subtitle {
    text-align: center;
    color: #5a6b7b;
    font-size: 12px;
    margin-bottom: 14px;
  }

  .topbar {
    background: white;
    border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    padding: 12px;
    margin-bottom: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: center;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 130px;
  }
  .field label {
    font-size: 11px;
    color: #5a6b7b;
  }
  .field input, .field select {
    border: 1px solid #d3dae1;
    border-radius: 6px;
    padding: 7px 8px;
    font-size: 13px;
    font-family: inherit;
    background: #fbfcfd;
  }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: #2c5364;
    background: #fff;
  }

  .linkbox {
    max-width: 900px;
    margin: 0 auto 12px;
    background: #eef6ee;
    border: 1px solid #cfe8cf;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    color: #2f5d33;
    text-align: center;
    word-break: break-all;
  }
  .linkbox button {
    margin-top: 6px;
    background: #2c5364;
    color: white;
    border: none;
    padding: 5px 12px;
    border-radius: 5px;
    font-size: 12px;
    cursor: pointer;
  }

  .status {
    text-align: center;
    font-size: 11px;
    color: #8a97a3;
    margin-bottom: 8px;
    min-height: 14px;
  }
  .status.error { color: #c0392b; font-weight: bold; }

  .legend {
    text-align: center;
    color: #5a6b7b;
    font-size: 12px;
    margin-bottom: 12px;
  }
  .legend span {
    display: inline-block;
    margin: 2px 4px;
    padding: 2px 8px;
    border-radius: 6px;
  }
  .l1 { background: #d7f0dd; }
  .l2 { background: #dbe8fb; }
  .l3 { background: #fde3d2; }
  .l4 { background: #f1d9f7; }

  .table-wrap {
    overflow-x: auto;
    background: white;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  table {
    border-collapse: collapse;
    min-width: 1400px;
  }
  th, td {
    border: 1px solid #e2e6ea;
    text-align: center;
    padding: 2px;
  }
  th.namecol, td.namecol {
    position: sticky;
    right: 0;
    min-width: 110px;
    font-size: 13px;
  }
  th.namecol {
    background: #2c5364;
    color: white;
    z-index: 2;
  }
  td.namecol {
    background: #eef3f7;
    color: #1f2d3d;
    z-index: 1;
  }
  th {
    background: #2c5364;
    color: white;
    font-size: 11px;
    padding: 4px 2px;
    min-width: 46px;
  }
  th .dnum { font-size: 13px; display:block; }
  th .dname { font-size: 10px; font-weight: normal; opacity: 0.85; }

  td.cell {
    min-width: 46px;
    height: 40px;
    padding: 0;
  }
  td.cell[contenteditable="true"] {
    outline: none;
    font-size: 12px;
  }
  td.cell:focus {
    background: #fff8dc;
  }
  td.namecol[contenteditable="true"] {
    outline: none;
    text-align: center;
    padding-right: 4px;
  }

  .delbtn {
    background: #e57373;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 10px;
    padding: 2px 6px;
    cursor: pointer;
    margin-top: 2px;
  }

  .addrow {
    display: block;
    margin: 12px auto 0;
    background: #2c5364;
    color: white;
    border: none;
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  .addrow:active { opacity: 0.8; }

  .sharenote {
    text-align: center;
    font-size: 11px;
    color: #8a97a3;
    margin-top: 14px;
  }

  .setupBox {
    max-width: 640px;
    margin: 40px auto;
    background: white;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.1);
    line-height: 1.8;
    font-size: 14px;
    color: #1f2d3d;
  }
  .setupBox h2 { font-size: 17px; }
  .setupBox code {
    background: #f1f3f5;
    padding: 1px 5px;
    border-radius: 4px;
    direction: ltr;
    display: inline-block;
  }

  @media print {
    body { background: white; padding: 0; }
    .legend, .addrow, .topbar, .status, .sharenote, .delbtn, .linkbox { display: none; }
  }
</style>
</head>
<body>

<div id="setupBox" class="setupBox" style="display:none;">
  <h2>خطوة أخيرة قبل الاستخدام</h2>
  <p>الصفحة دي محتاجة "مفتاح" Firebase مجاني عشان المزامنة تشتغل من برة. هنعملها مع بعض خطوة خطوة.</p>
</div>

<div id="appRoot" style="display:none;">

<h1>جدول النوبتجية</h1>
<div class="subtitle" id="deptLabel"></div>

<div class="topbar">
  <div class="field">

  </div>
  <div class="field">

    <input id="deptInput" type="text" placeholder="اكتب اسم القسم">
  </div>
  <div class="field">
    <label>الشهر</label>
    <select id="monthSelect"></select>
  </div>
