<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جدول النوبتجية</title>

<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 14px 10px 40px;
    direction: rtl;
  }
  h1 { text-align: center; color: #1f2d3d; font-size: 20px; margin: 4px 0 4px; }
  .subtitle { text-align: center; color: #5a6b7b; font-size: 12px; margin-bottom: 14px; }
  .topbar {
    background: white; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    padding: 12px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 10px;
    align-items: center; justify-content: center;
  }
  .field { display: flex; flex-direction: column; gap: 3px; min-width: 130px; }
  .field label { font-size: 11px; color: #5a6b7b; }
  .field input, .field select {
    border: 1px solid #d3dae1; border-radius: 6px; padding: 7px 8px; font-size: 13px;
    font-family: inherit; background: #fbfcfd;
  }
  .field input:focus, .field select:focus { outline: none; border-color: #2c5364; background: #fff; }
  .linkbox {
    max-width: 900px; margin: 0 auto 12px; background: #eef6ee; border: 1px solid #cfe8cf;
    border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #2f5d33; text-align: center;
    word-break: break-all;
  }
  .linkbox button {
    margin-top: 6px; background: #2c5364; color: white; border: none; padding: 5px 12px;
    border-radius: 5px; font-size: 12px; cursor: pointer;
  }
  .status { text-align: center; font-size: 11px; color: #8a97a3; margin-bottom: 8px; min-height: 14px; }
  .status.error { color: #c0392b; font-weight: bold; }
  .legend { text-align: center; color: #5a6b7b; font-size: 12px; margin-bottom: 12px; }
  .legend span { display: inline-block; margin: 2px 4px; padding: 2px 8px; border-radius: 6px; }
  .l1 { background: #d7f0dd; } .l2 { background: #dbe8fb; } .l3 { background: #fde3d2; } .l4 { background: #f1d9f7; }
  .table-wrap { overflow-x: auto; background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  table { border-collapse: collapse; min-width: 1400px; }
  th, td { border: 1px solid #e2e6ea; text-align: center; padding: 2px; }
  th.namecol, td.namecol { position: sticky; right: 0; min-width: 110px; font-size: 13px; }
  th.namecol { background: #2c5364; color: white; z-index: 2; }
  td.namecol { background: #eef3f7; color: #1f2d3d; z-index: 1; }
  th { background: #2c5364; color: white; font-size: 11px; padding: 4px 2px; min-width: 46px; }
  th .dnum { font-size: 13px; display:block; }
  th .dname { font-size: 10px; font-weight: normal; opacity: 0.85; }
  td.cell { min-width: 46px; height: 40px; padding: 0; }
  td.cell[contenteditable="true"] { outline: none; font-size: 12px; }
  td.cell:focus { background: #fff8dc; }
  td.namecol[contenteditable="true"] { outline: none; text-align: center; padding-right: 4px; }
  .delbtn {
    background: #e57373; color: white; border: none; border-radius: 4px; font-size: 10px;
    padding: 2px 6px; cursor: pointer; margin-top: 2px;
  }
  .addrow {
    display: block; margin: 12px auto 0; background: #2c5364; color: white; border: none;
    padding: 8px 18px; border-radius: 6px; font-size: 14px; cursor: pointer;
  }
  .addrow:active { opacity: 0.8; }
  .sharenote { text-align: center; font-size: 11px; color: #8a97a3; margin-top: 14px; }
  @media print {
    body { background: white; padding: 0; }
    .legend, .addrow, .topbar, .status, .sharenote, .delbtn, .linkbox { display: none; }
  }
</style>
</head>
<body>

<h1>جدول النوبتجية</h1>
<div class="subtitle" id="deptLabel"></div>

<div class="topbar">
  <div class="field">
    <label>اسم المستشفى</label>
    <input id="hospitalInput" type="text" placeholder="اكتب اسم المستشفى">
  </div>
  <div class="field">
    <label>اسم القسم</label>
    <input id="deptInput" type="text" placeholder="اكتب اسم القسم">
  </div>
  <div class="field">
    <label>الشهر</label>
    <select id="monthSelect"></select>
  </div>
  <div class="field">
    <label>السنة</label>
    <input id="yearInput" type="number" min="2020" max="2100">
  </div>
</div>

<div class="linkbox">
  ده لينك الشهر ده تحديدًا في القسم ده. ابعتيه لزمايلك وهيشوفوا نفس الشهر بالظبط:
  <div id="deptLinkText" style="direction: ltr; margin-top:4px;"></div>
  <button onclick="copyDeptLink()">نسخ اللينك</button>
  <button onclick="toggleArchive()" style="margin-right:6px;">الأرشيف</button>
</div>

<div id="archivePanel" style="display:none; max-width:900px; margin:0 auto 12px; background:white; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,0.08); padding:10px;">
  <div style="font-size:13px; font-weight:bold; color:#1f2d3d; margin-bottom:6px;">كل الأقسام والشهور المسجلة</div>
  <div id="archiveList" style="font-size:12px; color:#5a6b7b;">جاري التحميل...</div>
</div>

<div class="status" id="statusMsg">جاري التحميل...</div>

<div class="legend">
  اكتب في كل خانة: <span class="l1">صبح</span><span class="l2">نوبتجية</span><span class="l3">سهر</span><span class="l4">عطلة</span>
</div>

<div class="table-wrap">
<table id="scheduleTable">
  <thead>
    <tr id="headerRow"><th class="namecol">الاسم</th></tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>
</div>

<button class="addrow" onclick="addRow('', null, true)">+ إضافة اسم جديد</button>

<div class="sharenote">كل قسم له جدوله الخاص، وكل شهر منفصل عن اللي قبله. التعديل هنا مايأثرش على أي قسم أو شهر تاني.</div>

<script>
const PROJECT_ID = "hospital-schedule-29cef";
const BASE_URL = "https://firestore.googleapis.com/v1/projects/" + PROJECT_ID + "/databases/default/documents";

const monthNames = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const dayNames = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];

const monthSelect = document.getElementById('monthSelect');
const yearInput = document.getElementById('yearInput');
const hospitalInput = document.getElementById('hospitalInput');
const deptInput = document.getElementById('deptInput');
const statusMsg = document.getElementById('statusMsg');
const headerRow = document.getElementById('headerRow');
const tableBody = document.getElementById('tableBody');
const deptLabel = document.getElementById('deptLabel');
const deptLinkText = document.getElementById('deptLinkText');

function encodeValue(v) {
  if (v === null || v === undefined) return { nullValue: null };
  if (typeof v === 'string') return { stringValue: v };
  if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  if (typeof v === 'boolean') return { booleanValue: v };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(encodeValue) } };
  if (typeof v === 'object') {
    const fields = {};
    for (const k in v) fields[k] = encodeValue(v[k]);
    return { mapValue: { fields: fields } };
  }
  return { nullValue: null };
}
function decodeValue(fv) {
  if (!fv) return null;
  if ('stringValue' in fv) return fv.stringValue;
  if ('integerValue' in fv) return parseInt(fv.integerValue, 10);
  if ('doubleValue' in fv) return fv.doubleValue;
  if ('booleanValue' in fv) return fv.booleanValue;
  if ('nullValue' in fv) return null;
  if ('arrayValue' in fv) return (fv.arrayValue.values || []).map(decodeValue);
  if ('mapValue' in fv) {
    const obj = {};
    const fields = fv.mapValue.fields || {};
    for (const k in fields) obj[k] = decodeValue(fields[k]);
    return obj;
  }
  return null;
}
function encodeDoc(obj) {
  const fields = {};
  for (const k in obj) fields[k] = encodeValue(obj[k]);
  return { fields: fields };
}
function decodeDoc(doc) {
  if (!doc || !doc.fields) return null;
  const obj = {};
  for (const k in doc.fields) obj[k] = decodeValue(doc.fields[k]);
  return obj;
}

async function getDoc(path) {
  const res = await fetch(BASE_URL + '/' + encodePathForUrl(path), { cache: 'no-store' });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  return decodeDoc(json);
}
async function setDoc(path, obj) {
  const encoded = encodeDoc(obj);
  const fieldPaths = Object.keys(encoded.fields);
  const body = {
    writes: [{
      update: {
        name: 'projects/' + PROJECT_ID + '/databases/default/documents/' + path,
        fields: encoded.fields
      },
      updateMask: { fieldPaths: fieldPaths }
    }]
  };
  const res = await fetch(BASE_URL.replace('/documents', '/documents:commit'), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    let detail = '';
    try { detail = await res.text(); } catch (e2) {}
    throw new Error('HTTP ' + res.status + (detail ? ' - ' + detail.slice(0, 200) : ''));
  }
  return res.json();
}

function setStatus(text, isError) {
  statusMsg.textContent = text;
  statusMsg.className = 'status' + (isError ? ' error' : '');
}

function sanitizeDeptId(name) {
  const trimmed = (name || '').trim();
  if (!trimmed) return 'قسم-عام';
  return trimmed.replace(/[\/\.\#\$\[\]]/g, '-').slice(0, 80);
}

function copyDeptLink() {
  const text = deptLinkText.textContent;
  navigator.clipboard.writeText(text).then(() => {
    setStatus('تم نسخ اللينك ✓');
  }).catch(() => {});
}

const urlParams = new URLSearchParams(window.location.search);
let deptName = urlParams.get('dept') || '';
let deptId = sanitizeDeptId(deptName);
deptInput.value = deptName;

monthNames.forEach((name, idx) => {
  const opt = document.createElement('option');
  opt.value = idx + 1;
  opt.textContent = name;
  monthSelect.appendChild(opt);
});

const now = new Date();
let currentYear = urlParams.get('year') ? parseInt(urlParams.get('year'), 10) : now.getFullYear();
let currentMonth = urlParams.get('month') ? parseInt(urlParams.get('month'), 10) : now.getMonth() + 1;
const urlSpecifiedMonth = !!(urlParams.get('year') && urlParams.get('month'));
let localDirty = false;
let pollTimer = null;

function metaPath() { return 'departments/' + deptId; }
function dataDocId(year, month) { return 'data-' + year + '-' + String(month).padStart(2, '0'); }
function dataPath(year, month) { return 'departments/' + deptId + '/months/' + dataDocId(year, month); }
function encodePathForUrl(path) { return path.split('/').map(encodeURIComponent).join('/'); }

function updateDeptLinkUI() {
  deptLabel.textContent = deptName ? ('صفحة قسم: ' + deptName + ' - ' + monthNames[currentMonth-1] + ' ' + currentYear) : 'صفحة قسم عام (لسه ما اتسمّاش)';
  const url = new URL(window.location.href);
  url.searchParams.set('dept', deptName || 'عام');
  url.searchParams.set('year', currentYear);
  url.searchParams.set('month', currentMonth);
  deptLinkText.textContent = url.toString();
  window.history.replaceState({}, '', url.toString());
}

function buildHeader(year, month) {
  headerRow.innerHTML = '<th class="namecol">الاسم</th>';
  const daysInMonth = new Date(year, month, 0).getDate();
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(year, month - 1, d);
    const th = document.createElement('th');
    th.innerHTML = '<span class="dnum">' + d + '</span><span class="dname">' + dayNames[date.getDay()] + '</span>';
    headerRow.appendChild(th);
  }
  return daysInMonth;
}

function addRow(name, cells, focusName) {
  const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
  const tr = document.createElement('tr');

  const nameTd = document.createElement('td');
  nameTd.className = 'namecol';
  nameTd.contentEditable = 'true';
  nameTd.textContent = name || '';
  nameTd.addEventListener('input', scheduleSave);
  tr.appendChild(nameTd);

  for (let d = 0; d < daysInMonth; d++) {
    const td = document.createElement('td');
    td.className = 'cell';
    td.contentEditable = 'true';
    td.textContent = (cells && cells[d]) ? cells[d] : '';
    td.addEventListener('input', scheduleSave);
    tr.appendChild(td);
  }

  const delTd = document.createElement('td');
  delTd.style.border = 'none';
  const delBtn = document.createElement('button');
  delBtn.className = 'delbtn';
  delBtn.textContent = 'حذف';
  delBtn.onclick = () => { tr.remove(); scheduleSave(); };
  delTd.appendChild(delBtn);
  tr.appendChild(delTd);

  tableBody.appendChild(tr);
  if (focusName) nameTd.focus();
}
window.addRow = addRow;

function collectRows() {
  const rows = [];
  tableBody.querySelectorAll('tr').forEach(tr => {
    const tds = tr.querySelectorAll('td.cell');
    const nameTd = tr.querySelector('td.namecol');
    const cells = [];
    tds.forEach(td => cells.push(td.textContent));
    rows.push({ name: nameTd.textContent, cells: cells });
  });
  return rows;
}

let saveTimer = null;
function scheduleSave() {
  localDirty = true;
  clearTimeout(saveTimer);
  setStatus('جاري الحفظ...');
  saveTimer = setTimeout(saveSchedule, 700);
}

async function saveSchedule() {
  try {
    const rows = collectRows();
    await setDoc(dataPath(currentYear, currentMonth), {
      rows: rows,
      department: deptName,
      hospital: hospitalInput.value,
      year: currentYear,
      month: currentMonth
    });
    setStatus('تم الحفظ ✓');
    localDirty = false;
  } catch (e) {
    setStatus('خطأ في الحفظ: ' + (e && e.message ? e.message : 'unknown'), true);
  }
}

async function saveMeta() {
  try {
    await setDoc(metaPath(), {
      hospital: hospitalInput.value,
      department: deptName,
      currentYear: currentYear,
      currentMonth: currentMonth
    });
  } catch (e) {
    // not critical
  }
}

function renderRowsFromData(rows) {
  tableBody.innerHTML = '';
  if (rows && rows.length) {
    rows.forEach(r => addRow(r.name, r.cells, false));
  } else {
    addRow('', null, false);
  }
}

function isEditingNow() {
  const active = document.activeElement;
  if (!active) return false;
  return active.isContentEditable || active === hospitalInput || active === deptInput || active === yearInput;
}

let lastDataSnapshot = null;

async function loadMonth(year, month, showLoading) {
  buildHeader(year, month);
  if (showLoading) {
    tableBody.innerHTML = '';
    setStatus('جاري التحميل...');
  }
  try {
    const data = await getDoc(dataPath(year, month));
    const snapshot = JSON.stringify(data ? data.rows : null);
    if (snapshot !== lastDataSnapshot) {
      lastDataSnapshot = snapshot;
      if (!isEditingNow() && !localDirty) {
        renderRowsFromData(data ? data.rows : null);
      }
    }
    if (tableBody.children.length === 0) addRow('', null, false);
    setStatus('');
  } catch (e) {
    setStatus('تعذر الاتصال بقاعدة البيانات. الجدول شغال محليًا بدون مزامنة.', true);
    if (tableBody.children.length === 0) addRow('', null, false);
  }
}

async function loadMeta() {
  try {
    const meta = await getDoc(metaPath());
    if (meta) {
      if (document.activeElement !== hospitalInput) hospitalInput.value = meta.hospital || '';
    }
  } catch (e) {
    // ignore transient errors
  }
}

async function switchMonth(year, month) {
  currentYear = year;
  currentMonth = month;
  monthSelect.value = month;
  yearInput.value = year;
  lastDataSnapshot = null;
  updateDeptLinkUI();
  await loadMonth(year, month, true);
  saveMeta();
}

async function switchDepartment(newName) {
  deptName = newName;
  deptId = sanitizeDeptId(newName);
  updateDeptLinkUI();
  lastDataSnapshot = null;
  await loadMonth(currentYear, currentMonth, true);
  await loadMeta();
}

monthSelect.addEventListener('change', () => {
  switchMonth(currentYear, parseInt(monthSelect.value, 10));
});
yearInput.addEventListener('change', () => {
  const y = parseInt(yearInput.value, 10);
  if (y >= 2020 && y <= 2100) switchMonth(y, currentMonth);
});
hospitalInput.addEventListener('input', () => { clearTimeout(saveTimer); saveTimer = setTimeout(saveMeta, 700); });

let deptDebounce = null;
deptInput.addEventListener('input', () => {
  deptName = deptInput.value.trim();
  deptId = sanitizeDeptId(deptName);
  clearTimeout(deptDebounce);
  deptDebounce = setTimeout(() => {
    switchDepartment(deptName);
    saveMeta();
  }, 800);
});

let archiveOpen = false;
async function toggleArchive() {
  const panel = document.getElementById('archivePanel');
  archiveOpen = !archiveOpen;
  panel.style.display = archiveOpen ? 'block' : 'none';
  if (archiveOpen) await loadArchive();
}
window.toggleArchive = toggleArchive;

async function loadArchive() {
  const listEl = document.getElementById('archiveList');
  listEl.textContent = 'جاري التحميل...';
  try {
    const res = await fetch(BASE_URL.replace('/documents', '/documents:runQuery'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      cache: 'no-store',
      body: JSON.stringify({
        structuredQuery: { from: [{ collectionId: 'months', allDescendants: true }] }
      })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const results = await res.json();
    const entries = [];
    (results || []).forEach(r => {
      if (!r.document) return;
      const data = decodeDoc(r.document);
      const nameParts = r.document.name.split('/departments/')[1];
      const docDeptId = nameParts ? decodeURIComponent(nameParts.split('/months/')[0]) : '';
      entries.push({
        deptId: docDeptId,
        department: data.department || docDeptId,
        hospital: data.hospital || '',
        year: data.year,
        month: data.month,
        fullPath: r.document.name
      });
    });
    entries.sort((a, b) => (b.year - a.year) || (b.month - a.month));
    if (entries.length === 0) {
      listEl.textContent = 'لسه مفيش جداول متسجلة.';
      return;
    }
    listEl.innerHTML = '';
    entries.forEach(e => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid #eee;';
      const label = document.createElement('span');
      label.textContent = (e.department || 'قسم') + (e.hospital ? (' - ' + e.hospital) : '') + ' - ' + (monthNames[(e.month||1)-1] || '') + ' ' + (e.year || '');
      const btns = document.createElement('span');
      const openBtn = document.createElement('button');
      openBtn.textContent = 'فتح';
      openBtn.style.cssText = 'margin-inline-start:6px; background:#2c5364; color:white; border:none; border-radius:4px; padding:3px 8px; font-size:11px;';
      openBtn.onclick = () => {
        const url = new URL(window.location.href);
        url.searchParams.set('dept', e.department || e.deptId);
        url.searchParams.set('year', e.year);
        url.searchParams.set('month', e.month);
        window.location.href = url.toString();
      };
      const delBtn = document.createElement('button');
      delBtn.textContent = 'حذف';
      delBtn.style.cssText = 'margin-inline-start:6px; background:#e57373; color:white; border:none; border-radius:4px; padding:3px 8px; font-size:11px;';
      delBtn.onclick = async () => {
        if (!confirm('متأكد إنك عايز تمسح ' + label.textContent + '؟')) return;
        try {
          await fetch(BASE_URL.replace('/documents', '/documents:commit'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ writes: [{ delete: e.fullPath }] })
          });
          row.remove();
        } catch (err) {
          alert('حصل خطأ أثناء الحذف');
        }
      };
      btns.appendChild(openBtn);
      btns.appendChild(delBtn);
      row.appendChild(label);
      row.appendChild(btns);
      listEl.appendChild(row);
    });
  } catch (e) {
    listEl.textContent = 'تعذر تحميل الأرشيف: ' + e.message;
  }
}

async function init() {
  monthSelect.value = currentMonth;
  yearInput.value = currentYear;
  updateDeptLinkUI();
  await loadMeta();
  monthSelect.value = currentMonth;
  yearInput.value = currentYear;
  await loadMonth(currentYear, currentMonth, true);
  pollTimer = setInterval(async () => {
    if (isEditingNow() || localDirty) return;
    await loadMeta();
    await loadMonth(currentYear, currentMonth, false);
  }, 4000);
}

init();
</script>

</body>
</html>
